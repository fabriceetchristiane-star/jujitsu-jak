<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informations — Jujitsu JAK</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header>
  <h1>📢 Informations</h1>
  <p>Stages, actualités club et fédération</p>
</header>

<section id="contenu-infos">
  <p style="color:#666;">Chargement des informations...</p>
</section>

<section>
  <a class="lien-bleu" href="index.html">⬅ Retour à l'accueil</a>
</section>

<footer>
  <p>🥋 Club JAK Lambersart — Judo · Aïkido · Karaté · Jujitsu</p>
</footer>

<script>
fetch('informations.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('contenu-infos');
    let html = '';

    if (data.stages && data.stages.length) {
      html += '<h2>🏅 Stages</h2>';
      data.stages.forEach(s => {
        html += `<div class="video-block"><strong>${s.titre}</strong><p style="margin-top:8px;color:#555;">${s.contenu}</p></div>`;
      });
    }
    if (data.club && data.club.length) {
      html += '<h2 style="margin-top:30px;">🏛️ Infos Club</h2>';
      data.club.forEach(s => {
        html += `<div class="video-block"><strong>${s.titre}</strong><p style="margin-top:8px;color:#555;">${s.contenu}</p></div>`;
      });
    }
    if (data.federation && data.federation.length) {
      html += '<h2 style="margin-top:30px;">📋 Fédération</h2>';
      data.federation.forEach(s => {
        html += `<div class="video-block"><strong>${s.titre}</strong><p style="margin-top:8px;color:#555;">${s.contenu}</p></div>`;
      });
    }
    container.innerHTML = html;
  })
  .catch(() => {
    document.getElementById('contenu-infos').innerHTML = '<p style="color:red;">Erreur de chargement.</p>';
  });
</script>

</body>
</html>
